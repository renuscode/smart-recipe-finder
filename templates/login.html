<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Recipe Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            background: #f8f9fa;
        }

        .login-container {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-card {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-title {

            text-align: center;

            margin-bottom: 25px;
        }

        .login-title i {

            font-size: 40px;

            color: #198754;

            margin-bottom: 10px;
        }

        .form-label {

            font-weight: 600;
        }

        .password-wrapper {

            position: relative;
        }

        .password-wrapper input {

            padding-right: 45px;
        }

        .password-toggle {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;
        }

        .login-btn {

            width: 100%;

            margin-top: 10px;
        }

        .signup-link {

            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="container login-container">

    <div class="login-card">


        <div class="login-title">

            <i class="fa-solid fa-right-to-bracket"></i>

            <h2>Login</h2>

            <p class="text-muted">
                Login to Smart Recipe Finder
            </p>

        </div>


        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login_page') }}"
            id="loginForm"
        >


            <!-- USERNAME -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    placeholder="Enter username"
                    autocomplete="username"
                >

                <div
                    id="usernameError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ email }}"
                    placeholder="Enter email address"
                    autocomplete="email"
                >

                <div
                    id="emailError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <div
                    id="passwordError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-success login-btn"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>


        </form>


        <div class="signup-link">

            <span>
                Don't have an account?
            </span>

            <a href="{{ url_for('signup_page') }}">
                Create Account
            </a>

        </div>


    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script>

$(document).ready(function () {


    // ==========================================
    // PASSWORD VISIBILITY
    // ==========================================

    $("#togglePassword").click(function () {

        const password =
            $("#password");

        const icon =
            $(this).find("i");


        if (
            password.attr("type") === "password"
        ) {

            password.attr(
                "type",
                "text"
            );

            icon.removeClass(
                "fa-eye"
            );

            icon.addClass(
                "fa-eye-slash"
            );

        } else {

            password.attr(
                "type",
                "password"
            );

            icon.removeClass(
                "fa-eye-slash"
            );

            icon.addClass(
                "fa-eye"
            );
        }

    });


    // ==========================================
    // LOGIN VALIDATION
    // ==========================================

    $("#loginForm").submit(function (event) {

        let valid = true;


        $("#usernameError").text("");

        $("#emailError").text("");

        $("#passwordError").text("");


        const username =
            $("#username").val().trim();

        const email =
            $("#email").val().trim();

        const password =
            $("#password").val();


        // USERNAME

        if (username === "") {

            $("#usernameError")
                .text(
                    "Username cannot be empty."
                );

            valid = false;
        }


        // EMAIL

        if (email === "") {

            $("#emailError")
                .text(
                    "Email ID cannot be empty."
                );

            valid = false;

        } else if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ) {

            $("#emailError")
                .text(
                    "Please enter a valid email address."
                );

            valid = false;
        }


        // PASSWORD

        if (password === "") {

            $("#passwordError")
                .text(
                    "Password cannot be empty."
                );

            valid = false;
        }


        if (!valid) {

            event.preventDefault();

        }

    });

});

</script>


</body>

</html>
