<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Smart Recipe Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            background: #f8f9fa;
        }

        .signup-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .signup-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .signup-title i {
            font-size: 40px;
            color: #198754;
            margin-bottom: 10px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .form-label {
            font-weight: 600;
        }

        .signup-btn {
            width: 100%;
            margin-top: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container signup-container">

    <div class="signup-card">

        <div class="signup-title">

            <i class="fa-solid fa-user-plus"></i>

            <h2>Create Account</h2>

            <p class="text-muted">
                Create your Smart Recipe Finder account
            </p>

        </div>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('signup_page') }}"
            id="signupForm"
        >

            <!-- USERNAME -->

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    placeholder="Enter username"
                    maxlength="30"
                    autocomplete="username"
                >

                <div
                    id="usernameError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    value="{{ email }}"
                    placeholder="Enter email address"
                    autocomplete="email"
                >

                <div
                    id="emailError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <div
                    id="passwordError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label
                    for="confirm_password"
                    class="form-label"
                >
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmPassword"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

                <div
                    id="confirmPasswordError"
                    class="text-danger small mt-1"
                ></div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn btn-success signup-btn"
            >
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </button>

        </form>


        <div class="login-link">

            <span>
                Already have an account?
            </span>

            <a href="{{ url_for('login_page') }}">
                Login
            </a>

        </div>

    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script>

$(document).ready(function () {

    // ==========================================
    // PASSWORD VISIBILITY
    // ==========================================

    $("#togglePassword").click(function () {

        const password = $("#password");

        const icon = $(this).find("i");

        if (password.attr("type") === "password") {

            password.attr("type", "text");

            icon.removeClass("fa-eye");
            icon.addClass("fa-eye-slash");

        } else {

            password.attr("type", "password");

            icon.removeClass("fa-eye-slash");
            icon.addClass("fa-eye");

        }

    });


    $("#toggleConfirmPassword").click(function () {

        const password = $("#confirm_password");

        const icon = $(this).find("i");

        if (password.attr("type") === "password") {

            password.attr("type", "text");

            icon.removeClass("fa-eye");
            icon.addClass("fa-eye-slash");

        } else {

            password.attr("type", "password");

            icon.removeClass("fa-eye-slash");
            icon.addClass("fa-eye");

        }

    });


    // ==========================================
    // FORM VALIDATION
    // ==========================================

    $("#signupForm").submit(function (event) {

        let valid = true;


        $("#usernameError").text("");
        $("#emailError").text("");
        $("#passwordError").text("");
        $("#confirmPasswordError").text("");


        const username =
            $("#username").val().trim();

        const email =
            $("#email").val().trim();

        const password =
            $("#password").val();

        const confirmPassword =
            $("#confirm_password").val();


        // USERNAME

        if (username === "") {

            $("#usernameError")
                .text("Username cannot be empty.");

            valid = false;

        } else if (username.length < 3) {

            $("#usernameError")
                .text("Username must contain at least 3 characters.");

            valid = false;

        } else if (
            !/^[A-Za-z0-9_]+$/.test(username)
        ) {

            $("#usernameError")
                .text(
                    "Username can contain only letters, numbers and underscore."
                );

            valid = false;
        }


        // EMAIL

        if (email === "") {

            $("#emailError")
                .text("Email ID cannot be empty.");

            valid = false;

        } else if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ) {

            $("#emailError")
                .text("Please enter a valid email address.");

            valid = false;
        }


        // PASSWORD

        if (password === "") {

            $("#passwordError")
                .text("Password cannot be empty.");

            valid = false;

        } else if (password.length < 8) {

            $("#passwordError")
                .text("Password must contain at least 8 characters.");

            valid = false;
        }


        // CONFIRM PASSWORD

        if (confirmPassword === "") {

            $("#confirmPasswordError")
                .text("Please confirm your password.");

            valid = false;

        } else if (
            password !== confirmPassword
        ) {

            $("#confirmPasswordError")
                .text("Passwords do not match.");

            valid = false;
        }


        if (!valid) {
            event.preventDefault();
        }

    });

});

</script>

</body>
</html>
